schema {
  query: Query
}

type Comment {
  "The identifier for this comment"
  id: Long!
  "When was this comment created"
  createDate: DateTime!
  "The user interaction info this comment belongs to"
  userInteractionInfo: UserInteractionInfo
  "The media item this comment belongs to"
  mediaItem: MediaItem
  "Content for the comment"
  content: String
}

type Favorite {
  "The identifier for this favorite"
  id: Long!
  "When was this favorite created"
  createDate: DateTime!
  "The user interaction info this favorite belongs to"
  userInteractionInfo: UserInteractionInfo
  "The media item this favorite belongs to"
  mediaItem: MediaItem
}

type MediaItem {
  "The identifier for this media item"
  id: Long!
  "When was this media item created"
  createDate: DateTime!
  "List of related ratings"
  ratings(where: RatingFilterInput @cost(weight: "10") order: [RatingSortInput!] @cost(weight: "10")): [Rating]
  "List of related comments"
  comments(where: CommentFilterInput @cost(weight: "10") order: [CommentSortInput!] @cost(weight: "10")): [Comment]
  "List of related favorites"
  favorites(where: FavoriteFilterInput @cost(weight: "10") order: [FavoriteSortInput!] @cost(weight: "10")): [Favorite]
}

type Query {
  "Returns a list of comments"
  comments(where: CommentFilterInput @cost(weight: "10") order: [CommentSortInput!] @cost(weight: "10")): [Comment!]! @cost(weight: "10")
  "Returns a comment"
  comment(id: Long!): Comment! @lookup @cost(weight: "10")
  "Returns a list of favorites"
  favorites(where: FavoriteFilterInput @cost(weight: "10") order: [FavoriteSortInput!] @cost(weight: "10")): [Favorite!]! @cost(weight: "10")
  "Returns a favorite"
  favorite(id: Long!): Favorite! @lookup @cost(weight: "10")
  "Returns a list of ratings"
  ratings(where: RatingFilterInput @cost(weight: "10") order: [RatingSortInput!] @cost(weight: "10")): [Rating!]! @cost(weight: "10")
  "Returns a rating"
  rating(id: Long!): Rating! @lookup @cost(weight: "10")
  "Returns a list of user interaction infos"
  userInteractionInfos(where: UserInteractionInfoFilterInput @cost(weight: "10") order: [UserInteractionInfoSortInput!] @cost(weight: "10")): [UserInteractionInfo!]! @cost(weight: "10")
  "Returns a user interaction info"
  userInteractionInfo(id: Long!): UserInteractionInfo! @lookup @cost(weight: "10")
  "Returns a user account"
  userAccount(id: String!): UserAccount! @lookup @cost(weight: "10")
  "Returns a media item"
  mediaItem(id: Long!): MediaItem! @lookup @cost(weight: "10")
}

type Rating {
  "The identifier for this rating"
  id: Long!
  "When was this rating created"
  createDate: DateTime!
  "The user interaction info this rating belongs to"
  userInteractionInfo: UserInteractionInfo
  "The media item this rating belongs to"
  mediaItem: MediaItem
  "The user interaction info this rating belongs to"
  value: Int!
}

type UserAccount {
  "The identifier for this user account"
  id: String!
  "When was this user account last changed"
  changeDate: DateTime
  "When was this user account created"
  createDate: DateTime!
  "Username for the user"
  userName: String!
  "The interaction info this user account is linked to"
  userInteractionInfo: UserInteractionInfo
}

type UserInteractionInfo {
  "The identifier for this user interaction info"
  id: Long!
  "When was this user interaction info last changed"
  changeDate: DateTime
  "When was this user interaction info created"
  createDate: DateTime!
  "Cout of ratings"
  ratingCount: Int!
  "Count of comments"
  commentCount: Int!
  "Count of favorites"
  favoriteCount: Int!
  "List of related ratings"
  ratings(where: RatingFilterInput @cost(weight: "10") order: [RatingSortInput!] @cost(weight: "10")): [Rating]
  "List of related comments"
  comments(where: CommentFilterInput @cost(weight: "10") order: [CommentSortInput!] @cost(weight: "10")): [Comment]
  "List of related favorites"
  favorites(where: FavoriteFilterInput @cost(weight: "10") order: [FavoriteSortInput!] @cost(weight: "10")): [Favorite]
  "The user account this interaction info is linked to"
  userAccount: UserAccount
}

input CommentFilterInput {
  and: [CommentFilterInput!]
  or: [CommentFilterInput!]
  "The user interaction info this comment belongs to"
  userInteractionInfo: UserInteractionInfoFilterInput
  "The media item this comment belongs to"
  mediaItem: MediaItemFilterInput
  "Content for the comment"
  content: StringOperationFilterInput
  createDate: DateTimeOperationFilterInput
  id: LongOperationFilterInput
}

input CommentSortInput {
  "The user interaction info this comment belongs to"
  userInteractionInfo: UserInteractionInfoSortInput @cost(weight: "10")
  "The media item this comment belongs to"
  mediaItem: MediaItemSortInput @cost(weight: "10")
  "Content for the comment"
  content: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input DateTimeOperationFilterInput {
  eq: DateTime @cost(weight: "10")
  neq: DateTime @cost(weight: "10")
  in: [DateTime] @cost(weight: "10")
  nin: [DateTime] @cost(weight: "10")
  gt: DateTime @cost(weight: "10")
  ngt: DateTime @cost(weight: "10")
  gte: DateTime @cost(weight: "10")
  ngte: DateTime @cost(weight: "10")
  lt: DateTime @cost(weight: "10")
  nlt: DateTime @cost(weight: "10")
  lte: DateTime @cost(weight: "10")
  nlte: DateTime @cost(weight: "10")
}

input FavoriteFilterInput {
  and: [FavoriteFilterInput!]
  or: [FavoriteFilterInput!]
  "The user interaction info this favorite belongs to"
  userInteractionInfo: UserInteractionInfoFilterInput
  "The media item this favorite belongs to"
  mediaItem: MediaItemFilterInput
  createDate: DateTimeOperationFilterInput
  id: LongOperationFilterInput
}

input FavoriteSortInput {
  "The user interaction info this favorite belongs to"
  userInteractionInfo: UserInteractionInfoSortInput @cost(weight: "10")
  "The media item this favorite belongs to"
  mediaItem: MediaItemSortInput @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input IntOperationFilterInput {
  eq: Int @cost(weight: "10")
  neq: Int @cost(weight: "10")
  in: [Int] @cost(weight: "10")
  nin: [Int] @cost(weight: "10")
  gt: Int @cost(weight: "10")
  ngt: Int @cost(weight: "10")
  gte: Int @cost(weight: "10")
  ngte: Int @cost(weight: "10")
  lt: Int @cost(weight: "10")
  nlt: Int @cost(weight: "10")
  lte: Int @cost(weight: "10")
  nlte: Int @cost(weight: "10")
}

input ListFilterInputTypeOfCommentFilterInput {
  all: CommentFilterInput @cost(weight: "10")
  none: CommentFilterInput @cost(weight: "10")
  some: CommentFilterInput @cost(weight: "10")
  any: Boolean @cost(weight: "10")
}

input ListFilterInputTypeOfFavoriteFilterInput {
  all: FavoriteFilterInput @cost(weight: "10")
  none: FavoriteFilterInput @cost(weight: "10")
  some: FavoriteFilterInput @cost(weight: "10")
  any: Boolean @cost(weight: "10")
}

input ListFilterInputTypeOfRatingFilterInput {
  all: RatingFilterInput @cost(weight: "10")
  none: RatingFilterInput @cost(weight: "10")
  some: RatingFilterInput @cost(weight: "10")
  any: Boolean @cost(weight: "10")
}

input LongOperationFilterInput {
  eq: Long @cost(weight: "10")
  neq: Long @cost(weight: "10")
  in: [Long] @cost(weight: "10")
  nin: [Long] @cost(weight: "10")
  gt: Long @cost(weight: "10")
  ngt: Long @cost(weight: "10")
  gte: Long @cost(weight: "10")
  ngte: Long @cost(weight: "10")
  lt: Long @cost(weight: "10")
  nlt: Long @cost(weight: "10")
  lte: Long @cost(weight: "10")
  nlte: Long @cost(weight: "10")
}

input MediaItemFilterInput {
  and: [MediaItemFilterInput!]
  or: [MediaItemFilterInput!]
  "List of related ratings"
  ratings: ListFilterInputTypeOfRatingFilterInput
  "List of related comments"
  comments: ListFilterInputTypeOfCommentFilterInput
  "List of related favorites"
  favorites: ListFilterInputTypeOfFavoriteFilterInput
  createDate: DateTimeOperationFilterInput
  id: LongOperationFilterInput
}

input MediaItemSortInput {
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input RatingFilterInput {
  and: [RatingFilterInput!]
  or: [RatingFilterInput!]
  "The user interaction info this rating belongs to"
  userInteractionInfo: UserInteractionInfoFilterInput
  "The media item this rating belongs to"
  mediaItem: MediaItemFilterInput
  "The user interaction info this rating belongs to"
  value: IntOperationFilterInput
  createDate: DateTimeOperationFilterInput
  id: LongOperationFilterInput
}

input RatingSortInput {
  "The user interaction info this rating belongs to"
  userInteractionInfo: UserInteractionInfoSortInput @cost(weight: "10")
  "The media item this rating belongs to"
  mediaItem: MediaItemSortInput @cost(weight: "10")
  "The user interaction info this rating belongs to"
  value: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input StringOperationFilterInput {
  and: [StringOperationFilterInput!]
  or: [StringOperationFilterInput!]
  eq: String @cost(weight: "10")
  neq: String @cost(weight: "10")
  contains: String @cost(weight: "20")
  ncontains: String @cost(weight: "20")
  in: [String] @cost(weight: "10")
  nin: [String] @cost(weight: "10")
  startsWith: String @cost(weight: "20")
  nstartsWith: String @cost(weight: "20")
  endsWith: String @cost(weight: "20")
  nendsWith: String @cost(weight: "20")
}

input UserAccountFilterInput {
  and: [UserAccountFilterInput!]
  or: [UserAccountFilterInput!]
  "Username for the user"
  userName: StringOperationFilterInput
  "The interaction info this user account is linked to"
  userInteractionInfo: UserInteractionInfoFilterInput
  changeDate: DateTimeOperationFilterInput
  createDate: DateTimeOperationFilterInput
  id: StringOperationFilterInput
}

input UserAccountSortInput {
  "Username for the user"
  userName: SortEnumType @cost(weight: "10")
  "The interaction info this user account is linked to"
  userInteractionInfo: UserInteractionInfoSortInput @cost(weight: "10")
  changeDate: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input UserInteractionInfoFilterInput {
  and: [UserInteractionInfoFilterInput!]
  or: [UserInteractionInfoFilterInput!]
  "Cout of ratings"
  ratingCount: IntOperationFilterInput
  "Count of comments"
  commentCount: IntOperationFilterInput
  "Count of favorites"
  favoriteCount: IntOperationFilterInput
  "List of related ratings"
  ratings: ListFilterInputTypeOfRatingFilterInput
  "List of related comments"
  comments: ListFilterInputTypeOfCommentFilterInput
  "List of related favorites"
  favorites: ListFilterInputTypeOfFavoriteFilterInput
  "The user account this interaction info is linked to"
  userAccount: UserAccountFilterInput
  changeDate: DateTimeOperationFilterInput
  createDate: DateTimeOperationFilterInput
  id: LongOperationFilterInput
}

input UserInteractionInfoSortInput {
  "Cout of ratings"
  ratingCount: SortEnumType @cost(weight: "10")
  "Count of comments"
  commentCount: SortEnumType @cost(weight: "10")
  "Count of favorites"
  favoriteCount: SortEnumType @cost(weight: "10")
  "The user account this interaction info is linked to"
  userAccount: UserAccountSortInput @cost(weight: "10")
  changeDate: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

enum SortEnumType {
  ASC
  DESC
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

directive @lookup on FIELD_DEFINITION

"The `@specifiedBy` directive is used within the type system definition language to provide a URL for specifying the behavior of custom scalar definitions."
directive @specifiedBy("The specifiedBy URL points to a human-readable specification. This field will only read a result for scalar types." url: String!) on SCALAR

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime @specifiedBy(url: "https:\/\/www.graphql-scalars.com\/date-time")

"The `Long` scalar type represents non-fractional signed whole 64-bit numeric values. Long can represent values between -(2^63) and 2^63 - 1."
scalar Long