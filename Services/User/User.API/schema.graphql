schema {
  query: Query
  mutation: Mutation
}

"The result for a new added user"
type AddUserPayload {
  "The new added user"
  userAccount: UserAccount!
}

"Country"
type Country {
  "The identifier for this country"
  id: String!
  "When was this country added to database"
  createDate: DateTime!
  "The german country name"
  nameGerman: String!
  "The english country name"
  nameEnglish: String!
  "The list of users that live in this country"
  users(where: UserAccountFilterInput @cost(weight: "10") order: [UserAccountSortInput!] @cost(weight: "10")): [UserAccount!]!
}

type Mutation {
  "Add a new user"
  addUser(input: AddUserInput!): AddUserPayload! @cost(weight: "10")
  "Update existing user"
  updateUser(input: UpdateUserInput!): UpdateUserPayload! @cost(weight: "10")
}

type Query {
  "Returns a list of users"
  userAccounts(where: UserAccountFilterInput @cost(weight: "10") order: [UserAccountSortInput!] @cost(weight: "10")): [UserAccount!]! @cost(weight: "10")
  "Returns a user account"
  userAccount(id: String!): UserAccount! @lookup @cost(weight: "10")
  "Returns a list of countries"
  countries(where: CountryFilterInput @cost(weight: "10") order: [CountrySortInput!] @cost(weight: "10")): [Country!]! @cost(weight: "10")
  "Returns a country"
  country(id: String!): Country! @lookup @cost(weight: "10")
}

"The result for a changed user"
type UpdateUserPayload {
  "The changed user"
  userAccount: UserAccount!
}

"User"
type UserAccount {
  "The identifier for this user"
  id: String!
  "When was this user created"
  createDate: DateTime!
  "When was this user last changed"
  changeDate: DateTime
  "The eMail-Adress for the user"
  eMail: String!
  "The user name for the user"
  userName: String!
  "The gender for the user"
  gender: EnumGenderType!
  "The given name for the user"
  givenName: String
  "The family name for the user"
  familyName: String
  "The street name for the adress of the user"
  street: String
  "The house number for the adress of the user"
  hnr: String
  "The ZIP-Code for the adress of the user"
  zip: String
  "The name of the city the user lives in"
  city: String
  "The assigned country the user lives in"
  country(where: CountryFilterInput @cost(weight: "10")): Country
}

"Input type for adding users"
input AddUserInput {
  "The Id for the user"
  id: String!
  "The eMail-Adress for the user"
  eMail: String!
  "The user name for the user"
  userName: String!
  "Gender for user"
  gender: EnumGenderType!
  "Givenname of user"
  givenName: String!
  "Family name of user"
  familyName: String!
  "Streetname of living adress"
  street: String!
  "Housenumber of living adress"
  hnr: String!
  "ZIP-Code of living adress"
  zip: String!
  "Cityname of living adress"
  city: String!
  "CountryId for the country of living adress"
  countryId: String!
}

"Country"
input CountryFilterInput {
  and: [CountryFilterInput!]
  or: [CountryFilterInput!]
  "The german country name"
  nameGerman: StringOperationFilterInput
  "The english country name"
  nameEnglish: StringOperationFilterInput
  "The list of users that live in this country"
  users: ListFilterInputTypeOfUserAccountFilterInput
  createDate: DateTimeOperationFilterInput
  id: StringOperationFilterInput
}

"Country"
input CountrySortInput {
  "The german country name"
  nameGerman: SortEnumType @cost(weight: "10")
  "The english country name"
  nameEnglish: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

input DateTimeOperationFilterInput {
  eq: DateTime @cost(weight: "10")
  neq: DateTime @cost(weight: "10")
  in: [DateTime] @cost(weight: "10")
  nin: [DateTime] @cost(weight: "10")
  gt: DateTime @cost(weight: "10")
  ngt: DateTime @cost(weight: "10")
  gte: DateTime @cost(weight: "10")
  ngte: DateTime @cost(weight: "10")
  lt: DateTime @cost(weight: "10")
  nlt: DateTime @cost(weight: "10")
  lte: DateTime @cost(weight: "10")
  nlte: DateTime @cost(weight: "10")
}

input EnumGenderTypeOperationFilterInput {
  eq: EnumGenderType @cost(weight: "10")
  neq: EnumGenderType @cost(weight: "10")
  in: [EnumGenderType!] @cost(weight: "10")
  nin: [EnumGenderType!] @cost(weight: "10")
}

input ListFilterInputTypeOfUserAccountFilterInput {
  all: UserAccountFilterInput @cost(weight: "10")
  none: UserAccountFilterInput @cost(weight: "10")
  some: UserAccountFilterInput @cost(weight: "10")
  any: Boolean @cost(weight: "10")
}

input StringOperationFilterInput {
  and: [StringOperationFilterInput!]
  or: [StringOperationFilterInput!]
  eq: String @cost(weight: "10")
  neq: String @cost(weight: "10")
  contains: String @cost(weight: "20")
  ncontains: String @cost(weight: "20")
  in: [String] @cost(weight: "10")
  nin: [String] @cost(weight: "10")
  startsWith: String @cost(weight: "20")
  nstartsWith: String @cost(weight: "20")
  endsWith: String @cost(weight: "20")
  nendsWith: String @cost(weight: "20")
}

"Input type for changing users"
input UpdateUserInput {
  "The Id for the user"
  id: String!
  "Gender for user"
  gender: EnumGenderType!
  "Givenname of user"
  givenName: String!
  "Family name of user"
  familyName: String!
  "Streetname of living adress"
  street: String!
  "Housenumber of living adress"
  hnr: String!
  "ZIP-Code of living adress"
  zip: String!
  "Cityname of living adress"
  city: String!
  "CountryId for the country of living adress"
  countryId: String!
}

"User"
input UserAccountFilterInput {
  and: [UserAccountFilterInput!]
  or: [UserAccountFilterInput!]
  "The eMail-Adress for the user"
  eMail: StringOperationFilterInput
  "The user name for the user"
  userName: StringOperationFilterInput
  "The gender for the user"
  gender: EnumGenderTypeOperationFilterInput
  "The given name for the user"
  givenName: StringOperationFilterInput
  "The family name for the user"
  familyName: StringOperationFilterInput
  "The street name for the adress of the user"
  street: StringOperationFilterInput
  "The house number for the adress of the user"
  hnr: StringOperationFilterInput
  "The ZIP-Code for the adress of the user"
  zip: StringOperationFilterInput
  "The name of the city the user lives in"
  city: StringOperationFilterInput
  "The assigned country the user lives in"
  country: CountryFilterInput
  changeDate: DateTimeOperationFilterInput
  createDate: DateTimeOperationFilterInput
  id: StringOperationFilterInput
}

"User"
input UserAccountSortInput {
  "The eMail-Adress for the user"
  eMail: SortEnumType @cost(weight: "10")
  "The user name for the user"
  userName: SortEnumType @cost(weight: "10")
  "The gender for the user"
  gender: SortEnumType @cost(weight: "10")
  "The given name for the user"
  givenName: SortEnumType @cost(weight: "10")
  "The family name for the user"
  familyName: SortEnumType @cost(weight: "10")
  "The street name for the adress of the user"
  street: SortEnumType @cost(weight: "10")
  "The house number for the adress of the user"
  hnr: SortEnumType @cost(weight: "10")
  "The ZIP-Code for the adress of the user"
  zip: SortEnumType @cost(weight: "10")
  "The name of the city the user lives in"
  city: SortEnumType @cost(weight: "10")
  "The assigned country the user lives in"
  country: CountrySortInput @cost(weight: "10")
  changeDate: SortEnumType @cost(weight: "10")
  createDate: SortEnumType @cost(weight: "10")
  id: SortEnumType @cost(weight: "10")
}

enum EnumGenderType {
  MALE
  FEMALE
  DIVERS
}

enum SortEnumType {
  ASC
  DESC
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION

directive @lookup on FIELD_DEFINITION

"The `@specifiedBy` directive is used within the type system definition language to provide a URL for specifying the behavior of custom scalar definitions."
directive @specifiedBy("The specifiedBy URL points to a human-readable specification. This field will only read a result for scalar types." url: String!) on SCALAR

"The `DateTime` scalar represents an ISO-8601 compliant date time type."
scalar DateTime @specifiedBy(url: "https:\/\/www.graphql-scalars.com\/date-time")